<!DOCTYPE html>
<html>
<head>
<title>Afroplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center}
header{background:#e50914;padding:20px;font-size:22px;font-weight:bold}
button{background:#e50914;color:white;border:none;padding:12px 20px;margin:5px;border-radius:8px}
.card{background:#1a1a1a;margin:15px;padding:20px;border-radius:10px}
</style>
</head>
<body>
<header>AFROPLAY 🍿</header>
<h1>Watch African Movies, Series & Music</h1>

<div class="card">
<button onclick="showSection('fan')">🎧 Fan</button>
<button onclick="showSection('artist')">🎤 Artist</button>
<button onclick="showSection('admin')">🔐 Admin</button>
</div>

<div id="fan" class="card">
<h2>🎧 For Fans</h2>
<p>Listen to songs, watch videos.</p>
<h3>Skiljoewise - Aa Jesus</h3>
<audio controls src="aa-jesus.mp3"></audio>
</div>

<div id="artist" class="card" style="display:none">
<h2>🎤 For Artists</h2>
<p>Upload your song, show your music.</p>
<button>Upload Song</button>
</div>

<div id="admin" class="card" style="display:none">
<h2>🔐 For Admin</h2>
<p>Welcome boss. Manage songs here.</p>
</div>

<script>
function showSection(name){
  if(name == 'admin'){
    let pass = prompt("Enter Admin Password:");
    if(pass != "Bmb@14700"){
      alert("Wrong password!");
      return;
    }
  }
  document.getElementById('fan').style.display = 'none';
  document.getElementById('artist').style.display = 'none';
  document.getElementById('admin').style.display = 'none';
  document.getElementById(name).style.display = 'block';
}
</script>
</body>
</html>
