<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afroplay</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;text-align:center}
header{padding:20px;background:linear-gradient(90deg,#ff0055,#ffaa00)}
nav{display:flex;justify-content:center;gap:8px;padding:12px;background:#1a1a1a;position:sticky;top:0}
nav button{padding:12px 16px;border:none;border-radius:25px;background:#ff0055;color:#fff;font-weight:bold;font-size:15px}
nav button.active{background:#fff;color:#000}
.page{display:none;padding:20px}
.page.show{display:block}
.card{background:#1e1e1e;padding:18px;border-radius:14px;max-width:500px;margin:15px auto;text-align:left}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;box-sizing:border-box}
.btn{width:100%;padding:14px;background:#ff0055;color:#fff;border:none;border-radius:10px;font-weight:bold}
audio{width:100%}
</style>
</head>
<body>
<header><h1>🎵 AFROPLAY</h1><p>Afrobeat • Amapiano • Gospel • Highlife</p></header>
<nav>
<button id="b-fan" class="active" onclick="go('fan')">For Fans</button>
<button id="b-artist" onclick="go('artist')">For Artists</button>
<button id="b-admin" onclick="go('admin')">For Admin</button>
</nav>
<div id="fan" class="page show"><h2>🔥 For Fans</h2><div class="card"><h3>⭐ Song of the Week</h3><p><b>Skiljoewise - Aa Jesus</b></p><audio controls src="aa-jesus.mp3"></audio><p>If song show 0:00, mp3 never upload yet.</p></div></div>
<div id="artist" class="page"><h2>🎤 For Artists</h2><div class="card"><h3>Upload Your Song</h3><input id="t" placeholder="Song Title"><input id="n" placeholder="Artist Name"><input type="file" id="f" accept="audio/*"><button class="btn" onclick="up()">Upload Song</button><p id="am"></p><div id="list"></div></div></div>
<div id="admin" class="page"><h2>🔐 For Admin</h2><div class="card"><input type="password" id="p" placeholder="Password - try 1234"><button class="btn" onclick="un()">Unlock Dashboard</button><p id="pm"></p><div id="ap" style="display:none"><p>✅ Dashboard Opened!</p></div></div></div>
<script>
function go(id){
document.getElementById('fan').classList.remove('show');
document.getElementById('artist').classList.remove('show');
document.getElementById('admin').classList.remove('show');
document.getElementById(id).classList.add('show');
document.getElementById('b-fan').classList.remove('active');
document.getElementById('b-artist').classList.remove('active');
document.getElementById('b-admin').classList.remove('active');
document.getElementById('b-'+id).classList.add('active');
window.scrollTo(0,0);
}
function un(){
var v=document.getElementById('p').value;
if(v==='1234'||v==='Bmb@14700'){document.getElementById('ap').style.display='block';document.getElementById('pm').innerText='✅ Dashboard Opened!';}
else{document.getElementById('pm').innerText='❌ Wrong password';alert('Wrong password, try 1234');}
}
function up(){
var t=document.getElementById('t').value;
var n=document.getElementById('n').value;
var file=document.getElementById('f').files[0];
if(!t||!n){alert('Type Title and Artist Name');return;}
if(!file){alert('Choose mp3 first');return;}
var u=URL.createObjectURL(file);
document.getElementById('list').innerHTML='<p><b>'+n+' - '+t+'</b></p><audio controls src="'+u+'"></audio>';
document.getElementById('am').innerText='✅ Song Uploaded!';
}
</script>
</body>
</html>
