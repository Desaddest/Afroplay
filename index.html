<!-- COVER + PROFILE MENU -->
<div style="position:relative">
  <!-- Cover Picture -->
  <img src="cover.jpg" onerror="this.src='https://via.placeholder.com/800x200/FF0055/ffffff?text=Afroplay+Cover'" style="width:100%;height:180px;object-fit:cover;display:block">
  <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.8));padding:35px 15px 12px">
    <h1 style="margin:0;font-size:26px">🎵 Afroplay</h1>
    <p style="margin:3px 0;color:#ddd;font-size:12px">Home of Skiljoewise • Afikpo North, Ebonyi State</p>
  </div>
  <!-- Profile Picture Menu Button -->
  <div style="position:absolute;top:12px;right:12px;text-align:right">
    <img src="profile.jpg" onerror="this.src='https://via.placeholder.com/50/ffffff/FF0055?text=SK'" onclick="toggleProfileMenu()" style="width:48px;height:48px;border-radius:50%;border:3px solid #fff;object-fit:cover;cursor:pointer">
    <div id="profileMenu" style="display:none;background:#1a1a1a;border-radius:12px;margin-top:5px;overflow:hidden;text-align:left;box-shadow:0 5px 20px rgba(0,0,0,0.5);min-width:160px">
      <div onclick="showSection('artist');toggleProfileMenu()" style="padding:12px;border-bottom:1px solid #333;cursor:pointer">👤 My Profile<br><span style="color:#aaa;font-size:11px">Skiljoewise</span></div>
      <div onclick="showSection('fan');toggleProfileMenu()" style="padding:12px;border-bottom:1px solid #333;cursor:pointer">❤️ My Fan Club</div>
      <div onclick="showSection('admin');toggleProfileMenu()" style="padding:12px;border-bottom:1px solid #333;cursor:pointer">⚙️ Settings</div>
      <div onclick="toggleProfileMenu();alert('You have logged out')" style="padding:12px;cursor:pointer;color:#ff5555">🚪 Logout</div>
    </div>
  </div>
</div>
<script>
function toggleProfileMenu(){
  var m=document.getElementById('profileMenu');
  m.style.display = m.style.display==='none' || m.style.display==='' ? 'block':'none';
}
</script>
